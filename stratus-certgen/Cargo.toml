[package]
name = "stratus-certgen"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stratus-certgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eyre.workspace = true
color-eyre = "0.6.5"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = { version = "0.3", features = ["std"] }
