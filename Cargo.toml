[package]
name = "stratus"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["http2"] }
axum-server = { version = "0.7.2", features = ["rustls", "tls-rustls"] }
chrono = "0.4"
color-eyre = "0.6.5"
dotenvy = "0.15.7"
eyre = "0.6.12"
glob = "0.3"
html-escape = "0.2"
humansize = "2.1"
listenfd = "1.0.2"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9.8"
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.6", features = [
    "compression-gzip",
    "compression-zstd",
    "cors",
    "decompression-gzip",
    "decompression-zstd",
    "limit",
    "fs",
] }
tracing = { version = "0.1.41", features = ["release_max_level_debug", "log"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = [
    "chrono",
    "serde",
    "json",
    "env-filter",
] }
urlencoding = "2.1"

[dev-dependencies]
flate2 = "1.1.4"
http = "1.3.1"
zstd = "0.13.3"
