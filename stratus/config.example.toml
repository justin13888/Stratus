# Stratus Server Configuration
# This is an example configuration file showing all available options
#
# Implementation Status:
# ✅ = Fully implemented and working
# ⚠️  = Partially implemented (loaded but not fully applied)
# ❌ = Not yet implemented (loaded but not used)

[server]
# Server bind address ✅
bind_address = "0.0.0.0" # Note: You may want to change this

# Server port ✅
port = 8443

# Server name/identifier ✅ (used in Server response header)
server_name = "Stratus"

# Working directory for the server (optional) ✅ (used for cache and server-generated files)
# Does NOT change the process's working directory - only used as base path for server data
# Defaults to current directory if not specified
# workdir = "/var/lib/stratus"

[tls]
# Path to TLS certificate file ✅
cert_file = "cert.pem"

# Path to TLS private key file ✅
key_file = "key.pem"

# Minimum TLS version ("1.2" or "1.3") ⚠️ (loaded but not enforced - axum-server limitation)
min_version = "1.3"

# Enable OCSP stapling ❌ (loaded but not implemented)
ocsp_stapling = true

# Client certificate authentication mode: "none", "optional", "required" ⚠️ (loaded but not enforced at TLS layer - use auth_method = "mutual_tls" to enable mTLS auth)
client_cert_mode = "none"

# Path to client CA certificate file (for client cert verification) ⚠️ (loaded but not enforced at TLS layer)
# client_ca_file = "client_ca.pem"

# Note: HTTP/2 configuration has been removed as axum-server doesn't expose these settings
# The library uses sensible defaults for HTTP/2

[logging]
# Log level: "trace", "debug", "info", "warn", "error" ✅
level = "info"

# Log file path (optional, logs to stdout if not specified) ✅
# Enables daily rotating file logs when specified
# file = "/var/log/stratus/server.log"

# Enable per-request access logging (method, URI, status, duration, client IP) ✅
# access_log = true

[metrics]
# Enable Prometheus metrics collection ✅
enabled = true

# Metrics endpoint path ✅ (default: "/metrics")
endpoint = "/metrics"

# Optional: Run metrics on a separate HTTP server (no TLS) ✅
# If you specify a different bind_address or port (or both), metrics will be served on a separate server.
# - If only bind_address is specified, the main server's port will be used
# - If only port is specified, the main server's bind_address will be used
# - If both are the same as the main server, metrics will be served on the main server
# This is useful for isolating metrics traffic and simplifying Prometheus configuration
# bind_address = "127.0.0.1"   # Defaults to main server's bind_address if not specified
# port = 9090                  # Defaults to main server's port if not specified

[network]
# Maximum number of concurrent requests ✅ (enforced via tower ConcurrencyLimitLayer)
# Note: This limits concurrent requests, not TCP connections. In HTTP/2, a single connection
# can multiplex many requests, so this is generally more useful than limiting raw connections.
# max_connections = 10000

# Connection timeout (seconds) ✅ (used for graceful shutdown timeout)
# connection_timeout = 60

# Request timeout (seconds) ✅ (enforced on all requests)
# request_timeout = 30

# Maximum request body size (bytes) ✅ (enforced via tower-http RequestBodyLimitLayer)
# Default: 100MB
# max_request_size = 104857600

# Enable TCP keepalive ✅
# tcp_keepalive = true

# TCP keepalive interval (seconds) ✅
# tcp_keepalive_interval = 60

# Enable TCP nodelay (disable Nagle's algorithm) ✅
# tcp_nodelay = true

# Listen backlog size ✅
# listen_backlog = 1024

[security]
# Enable authentication ✅
auth_required = true

# Authentication method: "basic", "mutual_tls" ✅ (basic auth and mTLS both implemented)
auth_method = "basic"

# Path to user database file (format depends on auth_method) ✅ (TOML format for basic auth)
# For basic auth, use a TOML file with [users.<username>] sections
# See users.example.toml for format
user_db_file = "users.toml"

# Enable CORS ✅
# cors_enabled = false

# CORS allowed origins (empty = all origins) ⚠️ (loaded but specific origins not implemented, uses permissive)
# cors_allowed_origins = []

# Enable rate limiting ✅ (per-IP token bucket via governor)
# rate_limiting_enabled = false

# Rate limit: requests per minute per IP ✅
# rate_limit = 60

# Enable compression ✅
# compression_enabled = true

# Compression algorithms: "gzip", "zstd", "br" ✅ (all three algorithms individually configurable)
# compression_algorithms = ["gzip", "zstd"]

# Minimum size for compression (bytes) ✅ (responses smaller than this are not compressed)
# compression_min_size = 1024

# Directory Shares Configuration
# Similar to Samba, each share is defined as [shares.<name>]
# The share name becomes the default mount point unless overridden

[shares.test]
description = "Test share for development"
path = "./test"                             # ✅ Path validated on startup
enabled = true                              # ✅ Disabled shares are filtered out
browseable = true                           # ❌ Not yet wired (directory listing always shown)
read_only = false                           # ✅ Enforced on upload and delete operations
guest_ok = true                             # ✅ Unauthenticated users get read-only access

# [shares.public]
# # Human-readable description
# description = "Public file share"

# # Filesystem path to share
# path = "/srv/shares/public"

# # Whether the share is enabled
# enabled = true

# # Whether the share is browseable/listable
# browseable = true

# # Whether the share is read-only
# read_only = false

# # ACCESS CONTROL LISTS (ACLs) - ✅ Fully implemented
# # Authorization is checked in this order:
# # 1. deny_list (takes precedence over everything)
# # 2. admin_list (grants full access)
# # 3. write_list (grants read + write access)
# # 4. read_list (grants read-only access)
# # 5. If all lists are empty, all authenticated users get default access
# #    (read/write if not read_only, read-only if read_only)
# #
# # Groups can be specified as: "groupname", "@groupname", or "+groupname"
# # Examples: ["alice", "bob", "@developers", "+admins"]

# # List of users/groups with read access
# # Empty = all authenticated users (if other lists are also empty)
# read_list = []

# # List of users/groups with write access
# # Empty = all authenticated users can write (if not read_only and other lists are empty)
# write_list = []

# # List of users/groups with admin access (full control)
# admin_list = ["admin"]

# # List of users/groups explicitly DENIED access (takes precedence over all other lists)
# deny_list = []

# # Allow guest/anonymous access (unauthenticated users get read-only access)
# # Write operations always require authentication
# guest_ok = false

# # Maximum number of concurrent connections to this share (optional)
# # max_connections = 100

# # Hide dot files (files starting with '.')
# hide_dot_files = false

# # Follow symbolic links
# # SECURITY: When false (recommended), symlinks are completely denied.
# # When true, symlinks are allowed but validated to ensure they stay within the share boundary.
# # Symlinks pointing outside the share are always denied regardless of this setting.
# follow_symlinks = false

# # File patterns to exclude (glob patterns)
# exclude_patterns = ["*.tmp", "*.swp", ".DS_Store"]

# # File patterns to include (empty = all files)
# include_patterns = []

# # Enable versioning/snapshots
# versioning = false

# # Maximum file size allowed for upload (bytes, 0 = unlimited)
# max_file_size = 0

# # Enable file locking ❌ (loaded but not yet implemented)
# file_locking = true

# # Custom mount point/URL path (defaults to share name) ❌ (loaded but not yet implemented)
# # mount_point = "/custom-path"

